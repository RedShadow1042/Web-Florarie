<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Autentificare - Floraria x</title>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <h1>Floraria x</h1>
            <p>~ Secțiune Cont ~</p>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Pagina Principala</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-content">
        <div id="logged-in-panel" class="auth-container" style="display: none;">
            <div class="auth-box" style="max-width: 500px;">
                <h2 id="welcome-message">Gestionare Cont</h2>
                <p style="margin-bottom: 25px; color: #666; text-align: center;">Informațiile profilului tău:</p>
                
                <div class="profile-data-list">
                    <div class="profile-data-item">
                        <div>
                            <strong>Nume complet:</strong>
                            <p id="display-name">-</p>
                        </div>
                        <button class="view-details btn-small" id="open-modal-name">Modifică</button>
                    </div>

                    <div class="profile-data-item">
                        <div>
                            <strong>Adresă Email:</strong>
                            <p id="display-email">-</p>
                        </div>
                        <button class="view-details btn-small" id="open-modal-email">Modifică</button>
                    </div>

                    <div class="profile-data-item">
                        <div>
                            <strong>Parolă:</strong>
                            <p>••••••••••••</p>
                        </div>
                        <button class="view-details btn-small" id="open-modal-password">Schimbă Parola</button>
                    </div>
                </div>

                <div class="profile-actions-area" style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px; width: 100%;">
                    <button class="btn-profile-action btn-logout" id="logout-btn">Deconectare Cont</button>
                    <button class="btn-profile-action btn-delete-account" id="delete-account-btn">Șterge Contul Definitiv</button>
                </div>
            </div>
        </div>

        <div id="auth-forms" class="auth-container">
            <div class="auth-box">
                <h2>Conectare</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Parolă</label>
                        <input type="password" id="login-password" required style="padding-right: 65px;">
                        <span class="toggle-password-eye" onclick="togglePasswordVisibility('login-password')"></span>
                    </div>
                    <button type="submit" class="view-details">Intră în cont</button>
                </form>
            </div>

            <div class="auth-box">
                <h2>Creare Cont Nou</h2>
                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-name">Nume Complet</label>
                        <input type="text" id="reg-name" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Parolă</label>
                        <input type="password" id="reg-password" required style="padding-right: 65px;">
                        <span class="toggle-password-eye" onclick="togglePasswordVisibility('reg-password')"></span>
                    </div>
                    <div class="input-group checkbox-group">
                        <input type="checkbox" id="reg-is-admin">
                        <label for="reg-is-admin">Sunt Administrator (Cont special)</label>
                    </div>
                    <button type="submit" class="add-to-cart">Înregistrare</button>
                </form>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>

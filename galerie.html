<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Galerie - D.A.S Lotus</title>
    <style>
        #titlu {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 5%;
            font-family: Georgia, serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            text-shadow: -1px 1px 3px #210E09;
            letter-spacing: 0.04em;
        }

        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            padding: 40px 5%;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .gallery-item {
            flex: 0 0 260px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(92, 26, 35, 0.18);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #1a0a0a;
            aspect-ratio: 1 / 1;
        }

        .gallery-item:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 35px rgba(92, 26, 35, 0.35);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.35s ease, transform 0.4s ease;
        }

        .gallery-item:hover img {
            opacity: 0.55;
            transform: scale(1.07);
        }

        .gallery-item .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px 14px 14px;
            background: linear-gradient(to top, rgba(33,14,9,0.88) 0%, transparent 100%);
            color: #f2dfb6;
            font-family: Georgia, serif;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            transform: translateY(8px);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item .zoom-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            font-size: 2.2rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .gallery-item:hover .zoom-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .skeleton {
            flex: 0 0 260px;
            border-radius: 12px;
            aspect-ratio: 1 / 1;
            background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.06) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .gallery-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: rgba(242, 223, 182, 0.65);
            font-style: italic;
            font-size: 1.1rem;
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 3, 3, 0.92);
            z-index: 9000;
            justify-content: center;
            align-items: center;
        }

        #lightbox.open { display: flex; }

        #lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 10px 60px rgba(0,0,0,0.7);
            animation: zoomInLB 0.3s ease;
        }

        @keyframes zoomInLB {
            from { transform: scale(0.88); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        #lightbox-caption {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #f2dfb6;
            font-family: Georgia, serif;
            font-size: 1.05rem;
            background: rgba(33,14,9,0.7);
            padding: 8px 22px;
            border-radius: 30px;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        #lightbox-close {
            position: absolute;
            top: 20px; right: 28px;
            color: #f2dfb6;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            transition: color 0.2s;
        }

        #lightbox-close:hover { color: #d15b76; }

        .lb-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(242, 223, 182, 0.12);
            border: none;
            color: #f2dfb6;
            font-size: 2rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lb-arrow:hover { background: rgba(209, 91, 118, 0.4); }
        #lb-prev { left: 18px; }
        #lb-next { right: 18px; }

        @media (max-width: 600px) {
            .gallery-grid {
                gap: 14px;
                padding: 24px 4%;
            }
            .gallery-item,
            .skeleton {
                flex: 0 0 140px;
            }
            .lb-arrow { display: none; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-area">
            <h1>D.A.S Lotus</h1>
            <p>~ Locul Unde Frumusețea Prinde Viață ~</p>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Pagina Principala</a></li>
                <li><a href="buchete.html">Buchete</a></li>
                <li><a href="recenzii.html">Recenzii</a></li>
                <li><a href="galerie.html" class="active">Galerie</a></li>
                <li><a href="index.html#despre-noi">Despre Noi</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
        <div class="header-icons">
            <a href="autentificare.html" class="icon-user" style="text-decoration:none;color:white;">👤</a>
            <a href="cos.html" class="cart-icon" style="text-decoration:none;color:white;">🛒<span class="cart-count">0</span></a>
        </div>
    </header>

    <main class="site-content">
        <h1 id="titlu">✦ Explorează galeria florăriei noastre ✦</h1>
        <hr class="divider-line">
        <div id="gallery-container" class="gallery-grid"></div>
    </main>

    <div id="lightbox">
        <button id="lightbox-close">&#10005;</button>
        <button class="lb-arrow" id="lb-prev">&#8249;</button>
        <img id="lightbox-img" src="" alt="">

        <div id="lightbox-caption"></div>

    <script src="galerie.js"></script>
    <script src="script.js"></script>

</html>

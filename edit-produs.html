<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Editare Produs</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #444; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; margin-bottom: 10px; border-radius: 8px; border: 2px solid #eee; display: block; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #769b21; color: white; }
        .btn-cancel { background: #e0e0e0; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Editează Buchetul</h2>
        <form id="edit-form">
            <img id="current-img" class="preview-img" src="" alt="Imagine produs">
            <div class="form-group"><label>Imagine nouă:</label><input type="file" id="edit-image" accept="image/*"></div>
            <div class="form-group"><label>Nume:</label><input type="text" id="edit-name" required></div>
            <div class="form-group"><label>Preț (LEI):</label><input type="number" id="edit-price" required></div>
            <div class="form-group"><label>Reducere (%):</label><input type="number" id="edit-discount"></div>
            <div class="actions">
                <button type="button" class="btn-cancel" onclick="history.back()">Anulare</button>
                <button type="submit" class="btn-save">Salvează</button>
            </div>
        </form>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const index = params.get('index');
        let catalog = JSON.parse(localStorage.getItem('floraria_bouquets')) || [];
        const item = catalog[index];

        document.getElementById('current-img').src = item.image;
        document.getElementById('edit-name').value = item.name;
        document.getElementById('edit-price').value = item.price;
        document.getElementById('edit-discount').value = item.discount || 0;

        document.getElementById('edit-form').onsubmit = (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('edit-image');
            const saveChanges = (imgSrc) => {
                catalog[index].name = document.getElementById('edit-name').value;
                catalog[index].price = parseInt(document.getElementById('edit-price').value);
                catalog[index].discount = parseInt(document.getElementById('edit-discount').value);
                if (imgSrc) catalog[index].image = imgSrc;
                localStorage.setItem('floraria_bouquets', JSON.stringify(catalog));
                alert("Modificări salvate!");
                window.location.href = 'admin.html';
            };
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => saveChanges(ev.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveChanges();
            }
        };
    </script>
</body>
</html>

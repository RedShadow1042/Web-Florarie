<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Panou Administrator - D.A.S Lotus</title>
    <style>
        /* Stiluri pentru tab-uri */
        .admin-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        .tab-btn {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #5c1a23;
            background-color: white;
            color: #5c1a23;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: #5c1a23;
            color: white;
        }
        .admin-section {
            display: none; 
            width: 100%;
        }
        .admin-section.active {
            display: block; 
        }

        /* Stiluri pentru centrare perfectă pe mijloc */
        .admin-centered-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .admin-box {
            background-color: #fff9f3;
            border: 1px solid #eadecf;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .admin-box h2 {
            color: #5c1a23;
            font-family: Georgia, serif;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #eadecf;
            padding-bottom: 10px;
        }

        /* Stiluri pentru rândurile din listă */
        .admin-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border: 1px solid #eee;
            transition: border-left 0.2s ease;
            box-sizing: border-box;
        }
        .admin-product-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-delete:hover {
            background-color: #bd2130;
        }

        .admin-search-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px auto;
            box-sizing: border-box;
        }
        .admin-search-input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #eadecf;
            border-radius: 6px;
            box-sizing: border-box;
            background: #fffbf7;
        }
        .admin-search-input:focus {
            outline: none;
            border-color: #5c1a23;
            background: white;
        }

        /* Container Previzualizare Imagine */
        .image-preview-container {
            display: none;
            margin-top: 10px;
            background: #f0e6db;
            padding: 10px;
            border-radius: 6px;
            align-items: center;
            gap: 12px;
            border: 1px dashed #c4b4a2;
            box-sizing: border-box;
        }
        .image-preview-container img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #fff;
        }
        .image-preview-container span {
            font-size: 12px;
            color: #5c1a23;
            font-weight: bold;
        }

        /* Badge pentru afișare reducere */
        .discount-badge-admin {
            background: #dc3545;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="logo">
            <h1>D.A.S Lotus</h1>
            <p>~ Panou de Administrare ~</p>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Pagina Principala</a></li>
            </ul>
        </nav>
    </header>

    <main class="site-content" id="admin-main-content" style="display: none; padding: 0 20px;">
        
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="catalog-sec">Gestionare Produse</button>
            <button class="tab-btn" data-tab="active-orders-sec">Comenzi Active</button>
            <button class="tab-btn" data-tab="completed-orders-sec">Istoric Comenzi</button>
        </div>

        <div id="catalog-sec" class="admin-section active">
            <div class="admin-centered-container">
                
                <div class="cart-container admin-box">
                    <h2 id="form-title">Adaugă un buchet în catalog</h2>
                    <form id="add-product-form">
                        <div class="input-group">
                            <label for="prod-name">Nume Buchet</label>
                            <input type="text" id="prod-name" required placeholder="Ex: Buchet 19 Trandafiri Roșii">
                        </div>
                        
                        <div style="display: flex; gap: 15px; width: 100%;">
                            <div class="input-group" style="flex: 1;">
                                <label for="prod-price">Preț Întreg (LEI)</label>
                                <input type="number" id="prod-price" required placeholder="Ex: 150">
                            </div>
                            <div class="input-group" style="flex: 1;">
                                <label for="prod-discount">Reducere (%) <span style="color:#666; font-weight:normal;">(Opțional)</span></label>
                                <input type="number" id="prod-discount" min="0" max="99" placeholder="Ex: 20 (pentru 20%)" value="0">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="prod-desc">Descriere Buchet</label>
                            <textarea id="prod-desc" rows="3" placeholder="Ex: Conține trandafiri, verdeață decorativă și ambalaj premium..."></textarea>
                        </div>
                        <div class="input-group">
                            <label for="prod-image">Imagine Buchet</label>
                            <input type="file" id="prod-image" accept="image/*" required style="padding: 10px 0;">
                            
                            <div id="form-image-preview-box" class="image-preview-container">
                                <img id="form-preview-img" src="" alt="Preview">
                                <span id="form-preview-text">Imagine selectată</span>
                            </div>

                            <button type="button" id="clear-image-btn" style="display: none; background: #dc3545; color: white; border: none; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 8px; width: fit-content;">✕ Șterge imaginea selectată</button>
                        </div>
                        
                        <button type="submit" class="add-to-cart" id="submit-form-btn" style="margin-top: 15px;">Adăugă Buchet nou</button>
                        <button type="button" id="cancel-edit-btn" style="display: none; background: #666; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%;">Anulează Editarea</button>
                    </form>
                </div>

                <div class="cart-container admin-box" style="margin-top: 20px;">
                    <h2>Produse active în catalog</h2>
                    <p style="font-size: 13px; color: #666; margin-bottom: 15px; text-align: center;">
                        Bifează produsele pentru a le trimite pe prima pagină (<span id="homepage-count" style="font-weight:bold; color:#769b21;">0</span>/5 selectate)
                    </p>
                    <div id="admin-custom-products-list" style="width: 100%;"></div>
                </div>

            </div>
        </div>

        <div id="active-orders-sec" class="admin-section">
            <div class="admin-centered-container">
                <div class="admin-search-wrapper">
                    <input type="text" id="search-active-orders" class="admin-search-input" placeholder="🔍 Caută după ID comandă, nume sau email client...">
                </div>
                <div class="cart-container admin-box">
                    <h2>Comenzi Active (În așteptare)</h2>
                    <div id="admin-orders-active-list"></div>
                </div>
            </div>
        </div>

        <div id="completed-orders-sec" class="admin-section">
            <div class="admin-centered-container">
                <div class="admin-search-wrapper">
                    <input type="text" id="search-completed-orders" class="admin-search-input" placeholder="🔍 Caută după ID comandă, nume sau email client...">
                </div>
                <div class="cart-container admin-box">
                    <h2>Istoric Comenzi Finalizate</h2>
                    <div id="admin-orders-completed-list"></div>
                </div>
            </div>
        </div>

    </main>

    <script src="admin.js"></script>
</body>
</html>
